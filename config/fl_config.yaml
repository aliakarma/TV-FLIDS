federated_learning:
  num_clients: 20
  num_rounds: 100
  fraction_fit: 0.5
  fraction_evaluate: 0.3
  local_epochs: 5
  local_batch_size: 256
  local_lr: 0.001

trust:
  # Signal-mixing weights (alpha, beta, gamma) for the trust blend of paper
  # Eq. (6). Table IV specifies "Initial alpha,beta,gamma = 1/3 each", so these
  # are 1/3 each and NOT 0.4/0.4/0.2 as an earlier revision shipped.
  #
  # Who reads these three keys:
  #   * `--strategy tvflids_fixed` (ablation A6) -- TrustScorer holds them fixed
  #     for the whole run, so the CLI default must already BE the A6 setting.
  #     experiments/run_ablation.py used to supply 1/3 via trust_override on top
  #     of a 0.4/0.4/0.2 base, which made a direct CLI invocation silently
  #     disagree with the ablation runner (and with the paper).
  #   * `--strategy tvflids` (the proposed method) -- IGNORED. AdaptiveTrustScorer
  #     always initializes log-weights at 0, i.e. softmax(0) = (1/3, 1/3, 1/3),
  #     per Eq. (11); it never reads these keys. The values below therefore have
  #     no effect on the adaptive method either before or after this correction.
  # Sum must equal 1.0 to within 1e-5 (asserted in trust/trust_scorer.py).
  alpha: 0.3333333333333333
  beta: 0.3333333333333333
  gamma: 0.3333333333333333
  memory_decay: 0.9
  min_trust: 0.01
  meta_lr: 0.01

verification:
  # Nominal (post-warmup) gate thresholds — paper Table IV.
  loss_threshold: 0.0        # tau_L  (Check 1)
  cosine_threshold: 0.0      # tau_C  (Check 2) — fixed, never annealed
  zscore_threshold: 2.5      # tau_z  (Check 3)
  warmup_rounds: 20          # T_warm — drives BOTH annealing schedules
  # Warmup annealing of tau_L and tau_z (paper Section IV-A, Eq. 5 and the
  # Table IV footnote). Set false for a fixed-threshold gate (ablation).
  adaptive_thresholds: true
  warmup_loss_threshold: -0.1   # tau_L(0); annealed linearly to loss_threshold
  warmup_zscore_offset: 0.5     # tau_z(0) = zscore_threshold + this (= 3.0)

adversarial:
  attack_ratio: 0.3
  attack_type: "label_flip"
  gradient_scale_factor: 10.0
  noise_std: 0.5
  backdoor_poison_ratio: 0.1

evaluation:
  seeds: [42, 123, 456, 789, 1337]
  primary_seed: 42
  target_accuracy: 0.88

# Optional: enable to log last-round client params for Proposition 1 verification
log_client_params: false

# Per-stage wall-clock instrumentation for the overhead table (paper Table XII).
# Adds sub-millisecond bookkeeping per round; set false to disable entirely.
enable_overhead_tracking: true
