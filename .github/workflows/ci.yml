name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: [3.10]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU builds of torch to avoid CUDA dependency on CI
          python -m pip install torch==2.1.0+cpu torchvision==0.16.0+cpu -f https://download.pytorch.org/whl/cpu/torch_stable.html
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -q

      - name: Run smoke test (2-round FedAvg)
        run: |
          pytest -q tests/test_smoke.py
        env:
          TVFLIDS_SIM_CLIENT_CPUS: "2"

      - name: Run integration tests (2-round)
        run: |
          pytest -q tests/test_integration.py
        env:
          TVFLIDS_SIM_CLIENT_CPUS: "2"
